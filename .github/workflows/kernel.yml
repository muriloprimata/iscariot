name: kernel
on:
  workflow_dispatch:
  push:
    paths:
      - 'kernel/**'
      - 'tools/build-kernel.sh'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential bc flex bison libelf-dev libssl-dev
      - name: Build kernel
        run: ./tools/build-kernel.sh
      - uses: actions/upload-artifact@v4
        with:
          name: bzImage
          path: out/bzImage
